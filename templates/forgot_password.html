{% extends "base.html" %}
{% block title %}Forgot Password | Contactly{% endblock %}
{% block content %}
<div class="auth-page">
    <section class="auth-card forgot-card">
        <div class="auth-icon">
            <i class="fa-solid fa-key"></i>
        </div>
        <div class="auth-heading">
            <span class="eyebrow">Account recovery</span>
            <h1>Forgot your password?</h1>
            <p>No worries. Enter your email and we'll prepare a secure reset link.</p>
        </div>

        <form class="auth-form" method="POST" action="{{ url_for('forgot_password') }}">
            <label for="email">Email address</label>
            <div class="input-wrap">
                <i class="fa-regular fa-envelope"></i>
                <input type="email" id="email" name="email" placeholder="you@example.com" required autofocus>
            </div>
            <button class="auth-submit" type="submit">
                Send reset link
                <i class="fa-solid fa-arrow-right"></i>
            </button>
        </form>

        <a class="back-link" href="{{ url_for('login') }}">
            <i class="fa-solid fa-arrow-left"></i>
            Back to login
        </a>
    </section>
</div>
{% endblock %}
